# yaml-language-server: $schema=../home/catalog/project.schema.json
id: skills
question: Onde ficam as skills de agente que eu escrevi ou forkei, e de onde vêm as que instalei?
intent: ativo
domain: ai
shape: standalone
runs_on:
  - mac
stack:
  lang: python
  format: SKILL.md
  test: pytest
  hook: git-pre-commit
entities:
  - skill
  - installed_skill
  - credit
features:
  - skills-proprias-flow-task-spec-lite-tlc-idea-triage
  - origens-fixadas-das-skills-instaladas
  - validacao-do-skills-yaml
  - creditos-gerados-no-readme
  - instalacao-por-npx-skills
  - pre-commit-com-teste-por-skill
notes: |
  Repo público rcalegario/skills, licença MIT (tlc-spec-driven segue CC-BY-4.0). skills.yaml é a fonte: own (nome, teste, referências) e installed (repo, caminho, commit fixado); scripts/skills.py valida e gera os créditos.
  Instalação nesta máquina por symlinks em ~/.claude/skills (SETUP.md), sem skills-manager. As skills task e idea-triage leem o home de um config.yaml local ignorado pelo git.
  intent e domain são palpite.
