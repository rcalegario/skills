# skills.yaml - each own skill and the skills it was built from; checked by scripts/skills.py validate.
# own[].test runs from skills/<name>/ in the pre-commit hook.
# A reference is internal (skill: <own name>) or external (repo, path, commit: <sha>|unknown, license).
# installed[]: third-party skills, each with repo, path and the upstream commit it was updated to, or origin: unknown.
# relation: fork | derived | inspired. took: what was taken, in one line.

own:
  - name: flow
    test: uv run --no-project --with pytest --with pytest-xdist --with pyyaml python -m pytest -q -n auto scripts
    references:
      - repo: https://github.com/tech-leads-club/agent-skills
        path: packages/skills-catalog/skills/(development)/tlc-spec-driven
        commit: 8658b66
        license: CC-BY-4.0
        relation: derived
        took: Criteria proved by checks, with every gate enforced by a tested script
      - repo: https://github.com/humanlayer/skills
        path: plugins/show-me/skills/show-me
        commit: 4d69d20f6e9b
        license: MIT
        relation: inspired
        took: Shapes, flows and changes shown as visuals in the docs people read

  - name: task
    test: uv run --no-project --with pytest --with pyyaml python -m pytest -q scripts
    references:
      - repo: https://github.com/mattpocock/skills
        path: skills/productivity/grilling
        commit: 95249b0b4978
        relation: inspired
        took: Decisions asked in rounds over a design tree, each with a recommended answer
      - repo: https://github.com/mattpocock/skills
        path: skills/engineering/to-spec
        commit: 5c89081d4bbe
        relation: inspired
        took: Turning a base text into outcomes and requirements before any code
      - repo: https://github.com/mattpocock/skills
        path: skills/engineering/to-tickets
        commit: 9e2abf8611a3
        relation: inspired
        took: Splitting the work into slices that each ship on their own

  - name: code-review
    references:
      - repo: https://github.com/mattpocock/skills
        path: skills/engineering/code-review
        commit: 5863806dd4e1
        license: MIT
        relation: derived
        took: The whole review process, two parallel axes (Standards with a Fowler smell baseline, Spec) reported apart and never reranked; the review file written through flow.py is our addition

  - name: idea-triage
    test: ""
    references: []

  - name: retro-report
    test: uv run --no-project --with pytest --with pytest-xdist --with pyyaml python -m pytest -q -n auto scripts && claude plugin test mod
    references:
      - repo: https://github.com/mattpocock/skills
        path: skills/engineering/retro
        commit: 5863806dd4e1
        relation: derived
        took: The improvement categories a retro looks for and who fixes what, implementation or review

  - name: session-log
    test: uv run --no-project --with pytest --with pyyaml python -m pytest -q -p no:cacheprovider scripts
    references:
      - skill: retro-report
        relation: derived
        took: The session digest of retro.py (calls, failures, repeats, search streaks, tokens, cost, subagents), copied
      - repo: https://github.com/microsoft/TokenEconomizer
        path: tokeneconomizer/trace
        commit: 7042ea8
        license: Apache-2.0
        relation: inspired
        took: Reading a Claude Code transcript as an ordered list of tool calls with their results, through retro-report
      - repo: https://github.com/microsoft/TokenEconomizer
        path: tokeneconomizer/microskills/observe.py
        commit: 7042ea8
        license: Apache-2.0
        relation: inspired
        took: Classifying a command's output into error classes by pattern, through retro-report

